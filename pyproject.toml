[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lilium-mathematical-art"
version = "0.1.0"
description = "Mathematical reconstruction and procedural synthesis of a high-fidelity white-lily bouquet with rigorous typesetting"
authors = [
    {name = "Rajveersinh Vishal Pardeshi"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pillow>=10.0.0",
    "numba>=0.60.0",
    "typst>=0.11.0",
    "pymupdf>=1.24.0",
    "matplotlib>=3.9.0",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
